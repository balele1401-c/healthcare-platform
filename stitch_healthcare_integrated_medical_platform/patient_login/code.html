<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>HealthCare - Patient Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap" rel="stylesheet"/>

            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-secondary-fixed-variant": "#004f4f",
                        "background": "#f9f9ff",
                        "on-error": "#ffffff",
                        "on-primary": "#ffffff",
                        "surface-tint": "#0054d6",

                        "tertiary-fixed-dim": "#c3c7cb",
                        "surface-bright": "#f9f9ff",
                        "surface-container": "#e8eeff",
                        "secondary-container": "#90efef",
                        "on-tertiary-container": "#f4f8fc",
                        "on-error-container": "#93000a",
                        "primary-container": "#0066ff",
                        "tertiary-container": "#6d7276",
                        "surface-variant": "#dde2f3",
                        "on-secondary": "#ffffff",
                        "surface-container-lowest": "#ffffff",
                        "error": "#ba1a1a",
                        "secondary-fixed": "#93f2f2",
                        "error-container": "#ffdad6",
                        "inverse-surface": "#2a303d",
                        "secondary-fixed-dim": "#76d6d5",
                        "on-tertiary-fixed-variant": "#43474b",
                        "primary-fixed": "#dae1ff",
                        "primary-fixed-dim": "#b3c5ff",
                        "inverse-on-surface": "#ecf0ff",
                        "surface": "#f9f9ff",
                        "on-secondary-fixed": "#002020",
                        "tertiary-fixed": "#dfe3e7",
                        "on-primary-fixed-variant": "#003fa4",

                        "on-background": "#161c27",

                        "on-primary-container": "#f8f7ff",

                        "3xl": "64px",
                        "margin-mobile": "16px",
                        "base": "8px",
                        "container-max": "1440px",
                        "lg": "24px",
                        "2xl": "48px",
                        "xl": "32px",
                        "gutter": "24px",
                        "margin-desktop": "32px"
                    },
                    "fontFamily": {
                        "headline-md": ["Inter"],
                        "headline-sm": ["Inter"],
                        "label-md": ["Inter"],
                        "body-md": ["Inter"],
                        "body-lg": ["Inter"],
                        "display-lg": ["Inter"],
                        "headline-lg": ["Inter"],
                        "headline-lg-mobile": ["Inter"],
                        "body-sm": ["Inter"]
                    },
                    "fontSize": {
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "headline-sm": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "headline-lg-mobile": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }]

                }
            }
        }
    </script>
<style>
        body {
            background-color: theme('colors.background');
            color: theme('colors.on-background');
        }
        .clinical-shadow {
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.04);
        }
        .clinical-input:focus {
            box-shadow: 0 0 0 2px theme('colors.primary-fixed-dim');
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-margin-mobile md:p-margin-desktop bg-surface-container-low">
<!-- Top Navigation Suppressed due to Transactional Page Intent -->
<main class="w-full max-w-md">
<!-- Brand Header -->
<div class="text-center mb-xl">
<h1 class="font-display-lg text-display-lg text-primary tracking-tight">HealthCare</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-sm">Patient Portal</p>
</div>
<!-- Login Card -->
<div class="bg-surface rounded-xl clinical-shadow border border-outline-variant p-lg md:p-xl relative overflow-hidden">
<h2 class="font-headline-md text-headline-md text-on-surface mb-lg text-center">Welcome back</h2>
<form class="space-y-md">
<!-- Email Input -->
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-xs" for="email">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-outline" data-icon="mail">mail</span>
<input class="w-full pl-xl pr-sm py-sm bg-surface rounded-lg border border-outline-variant clinical-input focus:border-primary focus:ring-0 font-body-md text-body-md text-on-surface transition-shadow" id="email" placeholder="patient@example.com" required="" type="email"/>
</div>
</div>
<!-- Password Input -->
<div>
<div class="flex justify-between items-center mb-xs">
<label class="block font-label-md text-label-md text-on-surface-variant" for="password">Password</label>
<a class="font-label-md text-label-md text-primary hover:text-primary-container transition-colors" href="#">Forgot Password?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-outline" data-icon="lock">lock</span>
<input class="w-full pl-xl pr-xl py-sm bg-surface rounded-lg border border-outline-variant clinical-input focus:border-primary focus:ring-0 font-body-md text-body-md text-on-surface transition-shadow" id="password" placeholder="••••••••" required="" type="password"/>
<button aria-label="Toggle password visibility" class="absolute right-sm top-1/2 -translate-y-1/2 text-outline hover:text-on-surface-variant transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="visibility_off">visibility_off</span>
</button>
</div>
</div>
<!-- Sign In Button -->
<button class="w-full bg-primary text-on-primary font-body-md text-body-md font-semibold py-sm rounded-lg hover:bg-primary-container transition-colors hover:-translate-y-[1px] hover:shadow-md mt-lg" type="submit">
                    Sign In
                </button>
</form>
<!-- Divider -->
<div class="mt-lg mb-lg flex items-center">
<div class="flex-grow border-t border-outline-variant"></div>
<span class="px-sm font-label-md text-label-md text-outline">OR CONTINUE WITH</span>
<div class="flex-grow border-t border-outline-variant"></div>
</div>
<!-- Social Logins -->
<div class="grid grid-cols-2 gap-sm">
<button class="flex justify-center items-center py-sm border border-outline-variant rounded-lg hover:bg-surface-container-low transition-colors text-on-surface font-body-sm text-body-sm">
<img alt="Google" class="w-5 h-5 mr-sm object-contain" data-alt="A clean, minimalist Google logo icon rendered in high resolution against a pure white background. The G uses its standard colors but the overall aesthetic is sharp and corporate." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBOF6oMa4T_GWmWeCrVA6jejf7aq_Xoq_xtRmwmIIoTWAexEKwu1HK8HVtEN-vtJhL9HrpMwp3gyfZqCk6MZ2j0KAGIWZergMArNFrP_fIwX9HYQbTAZg8TPOcg-cnLPQcJyPz6e3aKcETJbe-b_1kA6Oobr6_rIRXWWQs72GoIzvAZpljeQtIiYliDpIfb6HSTrTl1YMMaMMwg5OwoW-UBN7bjih3_MLcRWdW69odpCuTDGhIXn2pQhA"/>
                    Google
                </button>
<button class="flex justify-center items-center py-sm border border-outline-variant rounded-lg hover:bg-surface-container-low transition-colors text-on-surface font-body-sm text-body-sm">
<img alt="Apple" class="w-5 h-5 mr-sm object-contain" data-alt="A sleek, flat Apple logo icon in deep black on a pure white background, suitable for a minimalist corporate healthcare interface." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBY6lDY0VT0MwXfr4ZNnW1cGoCrxTEjwWksNWXbglYOWBT74SaX2EFN_4k4Ttj3QPH3jWUQWYguyvLyNHi_FZs-Sur07a8ra3En8DmCfFMexygR3OsKV8liIhVw5KVJ6BnhzFQDUU2HWhY744Cci8r4bFNrGTVn1JspSTkAaT8Sh3cOziYsTY0Y4AinZCdhn-Ja7zoRl9xMmVrbVqNQD7ja5uLy-FAxqkug9vqQcxJvi0AlJMcbd3Gv4w"/>
                    Apple
                </button>
</div>
</div>
<!-- Create Account Link -->
<p class="text-center mt-lg font-body-md text-body-md text-on-surface-variant">
            Don't have an account? <a class="text-primary font-semibold hover:text-primary-container transition-colors" href="#">Create an account</a>
</p>
</main>
</body></html>
