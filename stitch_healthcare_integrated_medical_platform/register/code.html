<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>HealthCare - Registration</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

                        "on-tertiary-fixed": "#171c1f",
                        "on-secondary-container": "#006e6e",
                        "surface-container-low": "#f1f3ff",
                        "on-error-container": "#93000a",
                        "surface-variant": "#dde2f3",

<style>
        .clinical-shadow {
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.04);
        }
        .input-focus-ring:focus-within {
            box-shadow: 0 0 0 2px #dae1ff;
            border-color: #0050cb;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex items-center justify-center p-margin-mobile md:p-margin-desktop font-body-md">
<!-- Main Container -->
<div class="w-full max-w-[480px] bg-surface rounded-xl clinical-shadow border border-outline-variant p-lg md:p-xl flex flex-col gap-xl">
<!-- Header -->
<div class="text-center flex flex-col gap-sm">
<h1 class="font-display-lg text-display-lg text-primary">HealthCare</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Create your patient account</p>
</div>
<!-- Registration Form -->
<form class="flex flex-col gap-lg">
<!-- Full Name Input -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface" for="fullName">Full Name</label>
<div class="relative input-focus-ring rounded-lg border border-outline-variant bg-surface-container-lowest transition-all duration-200">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-on-surface-variant" style="font-variation-settings: 'FILL' 0;">person</span>
<input class="w-full pl-xl pr-sm py-sm rounded-lg border-none bg-transparent font-body-md text-body-md text-on-surface placeholder:text-outline focus:ring-0" id="fullName" placeholder="Jane Doe" type="text"/>
</div>
</div>
<!-- Email Input -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface" for="email">Email</label>
<div class="relative input-focus-ring rounded-lg border border-outline-variant bg-surface-container-lowest transition-all duration-200">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-on-surface-variant" style="font-variation-settings: 'FILL' 0;">mail</span>
<input class="w-full pl-xl pr-sm py-sm rounded-lg border-none bg-transparent font-body-md text-body-md text-on-surface placeholder:text-outline focus:ring-0" id="email" placeholder="jane@example.com" type="email"/>
</div>
</div>
<!-- Phone Number Input -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface" for="phone">Phone Number</label>
<div class="relative input-focus-ring rounded-lg border border-outline-variant bg-surface-container-lowest transition-all duration-200">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-on-surface-variant" style="font-variation-settings: 'FILL' 0;">phone</span>
<input class="w-full pl-xl pr-sm py-sm rounded-lg border-none bg-transparent font-body-md text-body-md text-on-surface placeholder:text-outline focus:ring-0" id="phone" placeholder="(555) 123-4567" type="tel"/>
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface" for="password">Password</label>
<div class="relative input-focus-ring rounded-lg border border-outline-variant bg-surface-container-lowest transition-all duration-200">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-on-surface-variant" style="font-variation-settings: 'FILL' 0;">lock</span>
<input class="w-full pl-xl pr-sm py-sm rounded-lg border-none bg-transparent font-body-md text-body-md text-on-surface placeholder:text-outline focus:ring-0" id="password" placeholder="••••••••" type="password"/>
</div>
</div>
<!-- Confirm Password Input -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface" for="confirmPassword">Confirm Password</label>
<div class="relative input-focus-ring rounded-lg border border-outline-variant bg-surface-container-lowest transition-all duration-200">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-on-surface-variant" style="font-variation-settings: 'FILL' 0;">lock</span>
<input class="w-full pl-xl pr-sm py-sm rounded-lg border-none bg-transparent font-body-md text-body-md text-on-surface placeholder:text-outline focus:ring-0" id="confirmPassword" placeholder="••••••••" type="password"/>
</div>
</div>
<!-- Terms Checkbox -->
<div class="flex items-start gap-sm mt-sm">
<div class="flex items-center h-5">
<input class="w-4 h-4 rounded border-outline-variant text-primary focus:ring-primary-fixed bg-surface-container-lowest" id="terms" type="checkbox"/>
</div>
<div class="text-body-sm font-body-sm text-on-surface-variant">
<label for="terms">I agree to the <a class="text-primary hover:underline font-semibold" href="#">Terms of Service</a> and <a class="text-primary hover:underline font-semibold" href="#">Privacy Policy</a>.</label>
</div>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary text-on-primary py-sm px-lg rounded-lg font-label-md text-label-md hover:bg-on-primary-fixed-variant transition-colors duration-200 mt-sm clinical-shadow hover:-translate-y-[1px]" type="submit">
                Sign Up
            </button>
</form>
<!-- Login Link -->
<div class="text-center">
<p class="font-body-sm text-body-sm text-on-surface-variant">
                Already have an account? 
                <a class="text-primary font-semibold hover:underline" href="#">Login</a>
</p>
</div>
</div>
</body></html>
