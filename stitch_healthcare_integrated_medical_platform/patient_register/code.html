<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md">
<!-- Header - Shared Component -->
<header class="bg-surface dark:bg-inverse-surface flex justify-between items-center w-full px-margin-mobile h-16 sticky top-0 z-50">
<div class="flex items-center gap-md">
<span class="material-symbols-outlined text-primary dark:text-inverse-primary" style="font-variation-settings: 'FILL' 0;">menu</span>
<h1 class="font-headline-md text-headline-md font-bold text-primary dark:text-inverse-primary">HealthCare</h1>
</div>
<div class="flex items-center">
<span class="font-label-md text-label-md text-on-surface-variant">User Profile</span>
</div>
</header>
<!-- Main Content: Split Screen -->
<main class="flex-grow flex flex-col md:flex-row w-full max-w-container-max mx-auto h-[calc(100vh-64px)]">
<!-- Left Side: Registration Form -->
<section class="w-full md:w-1/2 p-margin-mobile md:p-margin-desktop flex flex-col justify-center bg-surface">
<div class="max-w-md mx-auto w-full">
<div class="mb-xl">
<h2 class="font-headline-lg text-headline-lg text-on-surface mb-sm">Create an Account</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Join HealthCare to manage your medical records and appointments.</p>
</div>
<form class="space-y-md">
<!-- Full Name -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-xs" for="fullName">Full Name</label>
<input class="w-full rounded-sm border border-outline-variant bg-surface-container-lowest px-md py-sm font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary input-glow transition-all" id="fullName" placeholder="John Doe" type="text"/>
</div>
<!-- Email -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-xs" for="email">Email Address</label>
<input class="w-full rounded-sm border border-outline-variant bg-surface-container-lowest px-md py-sm font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary input-glow transition-all" id="email" placeholder="john@example.com" type="email"/>
</div>
<!-- Phone Number -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-xs" for="phone">Phone Number</label>
<input class="w-full rounded-sm border border-outline-variant bg-surface-container-lowest px-md py-sm font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary input-glow transition-all" id="phone" placeholder="+1 (555) 000-0000" type="tel"/>
</div>
<!-- Password -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-xs" for="password">Password</label>
<input class="w-full rounded-sm border border-outline-variant bg-surface-container-lowest px-md py-sm font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary input-glow transition-all" id="password" placeholder="••••••••" type="password"/>
</div>
<!-- Confirm Password -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-xs" for="confirmPassword">Confirm Password</label>
<input class="w-full rounded-sm border border-outline-variant bg-surface-container-lowest px-md py-sm font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary input-glow transition-all" id="confirmPassword" placeholder="••••••••" type="password"/>
</div>
<!-- Terms & Conditions -->
<div class="flex items-start mt-lg">
<div class="flex items-center h-5">
<input class="w-4 h-4 text-primary bg-surface-container-lowest border-outline-variant rounded focus:ring-primary-fixed-dim focus:ring-2" id="terms" type="checkbox"/>
</div>
<label class="ml-2 font-body-sm text-body-sm text-on-surface-variant" for="terms">
                            I agree to the <a class="text-primary hover:underline" href="#">Terms and Conditions</a> and <a class="text-primary hover:underline" href="#">Privacy Policy</a>.
                        </label>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary text-on-primary font-label-md text-label-md rounded-sm py-md mt-lg hover:bg-surface-tint hover:-translate-y-px custom-shadow transition-all duration-200" type="submit">
                        Register
                    </button>
</form>
<div class="mt-lg text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                        Already have an account? <a class="text-primary font-bold hover:underline" href="#">Log in here</a>
</p>
</div>
</div>
</section>
<!-- Right Side: Supportive Image/Illustration -->
<section class="hidden md:block w-1/2 relative bg-surface-container">
<div class="bg-cover bg-center w-full h-full absolute inset-0" data-alt="A modern, high-quality photograph of a bright, clean, minimalist hospital corridor or reception area. The lighting is soft and natural, emphasizing a clinical yet welcoming and calm atmosphere. The color palette features whites, subtle blue-grays, and clean modern aesthetics. Trustworthy healthcare environment." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuCvqpDcdY320da9ew-eYoROuMHF8w2nDZWgWY48IjbJH33ThKv3xiiDWDl2SS_NrPj3s37zUclqKgdsyrMJMuKA9Z4cQZy8hivYwTwt-_tllutH3ZmE-vebQgB8wW7I1ScB07EEcjYA8h_mtkJOTiPnXxyKEwokMt98132lfK8eYr33zuxzGYRXtdzo9_o_9JFfLd2aPEz6WuZZxzG3heprjnCtD70ypVgkFWPggNcV3RNw75yX5IJ2mA')"></div>

<div class="absolute inset-0 bg-gradient-to-t from-inverse-surface/80 to-transparent flex flex-col justify-end p-xl">
<div class="text-on-primary">
<h3 class="font-headline-md text-headline-md mb-sm">Modern Care, Simplified.</h3>
<p class="font-body-md text-body-md opacity-90 max-w-md">Experience healthcare management designed for clarity, security, and your peace of mind.</p>
</div>
</div>
</section>
