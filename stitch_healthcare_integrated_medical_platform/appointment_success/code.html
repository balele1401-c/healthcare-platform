<body class="bg-surface text-on-surface font-body-md min-h-screen flex items-center justify-center p-margin-mobile md:p-margin-desktop">
<main class="w-full max-w-[480px] mx-auto">

<div class="flex flex-col items-center text-center space-y-xl">
<!-- Animated Success Icon -->
<div class="relative flex items-center justify-center w-3xl h-3xl rounded-full bg-surface-container-low shadow-[0_4px_15px_rgba(0,0,0,0.04)] text-primary">
<span class="material-symbols-outlined !text-[48px]" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
<!-- Headers -->
<div class="space-y-sm">
<h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface">Appointment Confirmed!</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-[340px] mx-auto">
                    Your appointment with Dr. Sarah Jenkins has been successfully scheduled.
                </p>
</div>
<!-- Details Card -->
<div class="w-full bg-on-primary rounded-xl p-lg shadow-[0_4px_15px_rgba(0,0,0,0.04)] border border-outline-variant/30 text-left">
<div class="flex flex-col space-y-md">
<!-- Date -->
<div class="flex items-start space-x-md pb-md border-b border-outline-variant/30">
<div class="p-sm rounded-lg bg-surface-container-low text-primary flex items-center justify-center">
<span class="material-symbols-outlined">calendar_today</span>
</div>
<div>
<p class="font-label-md text-label-md text-on-surface-variant mb-xs">DATE</p>
<p class="font-headline-sm text-headline-sm text-on-surface">Thu, 19 Oct</p>
</div>
</div>
<!-- Time -->
<div class="flex items-start space-x-md pb-md border-b border-outline-variant/30">
<div class="p-sm rounded-lg bg-surface-container-low text-primary flex items-center justify-center">
<span class="material-symbols-outlined">schedule</span>
</div>
<div>
<p class="font-label-md text-label-md text-on-surface-variant mb-xs">TIME</p>
<p class="font-headline-sm text-headline-sm text-on-surface">10:30 AM</p>
</div>
</div>
<!-- Meeting Link -->
<div class="flex items-start space-x-md">
<div class="p-sm rounded-lg bg-surface-container-low text-primary flex items-center justify-center">
<span class="material-symbols-outlined">videocam</span>
</div>
<div class="flex-1">
<p class="font-label-md text-label-md text-on-surface-variant mb-xs">MEETING LINK</p>
<a class="font-body-md text-body-md text-primary hover:underline flex items-center space-x-xs" href="#">
<span>Join Video Call</span>
<span class="material-symbols-outlined !text-[16px]">open_in_new</span>
</a>
</div>
</div>
</div>
</div>
<!-- Actions -->
<div class="w-full flex flex-col space-y-md pt-lg">
<button class="w-full bg-primary text-on-primary font-label-md text-label-md py-md rounded-lg shadow-[0_4px_15px_rgba(0,0,0,0.04)] hover:bg-surface-tint hover:-translate-y-xs transition-all flex items-center justify-center space-x-sm">
<span>Go to My Appointments</span>
</button>
<button class="w-full bg-transparent text-primary font-label-md text-label-md py-md rounded-lg border border-primary hover:bg-surface-container-low transition-colors flex items-center justify-center space-x-sm">
