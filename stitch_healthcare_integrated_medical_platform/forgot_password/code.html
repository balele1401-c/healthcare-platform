<body class="bg-background min-h-screen flex items-center justify-center p-margin-mobile md:p-margin-desktop font-body-md text-body-md text-on-background relative overflow-hidden">
<!-- Decorative background elements for minimal depth -->
<div class="absolute top-0 left-0 w-full h-96 bg-gradient-to-b from-surface-container-low to-transparent -z-10"></div>
<div class="absolute -top-[20%] -right-[10%] w-[600px] h-[600px] rounded-full bg-primary/5 blur-[120px] -z-10"></div>
<!-- Main Card Container -->
<main class="w-full max-w-[440px] bg-surface-container-lowest rounded-[16px] p-xl shadow-[0_4px_15px_rgba(0,0,0,0.04)] border border-outline-variant">
<!-- Brand / Icon -->
<div class="flex justify-center mb-xl">
<div class="w-12 h-12 bg-surface-container-low rounded-xl flex items-center justify-center border border-outline-variant">
<span class="material-symbols-outlined text-primary text-[24px]">key</span>
</div>
</div>
<!-- Header -->
<div class="text-center mb-xl">
<h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface mb-sm">
                Forgot Password
            </h1>
<p class="font-body-md text-body-md text-on-surface-variant">
                Enter the email address associated with your account and we'll send you a link to reset your password.
            </p>
</div>
<!-- Form -->
<form action="#" class="space-y-lg" method="POST">
<!-- Email Input Group -->
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-xs" for="email">
                    Email Address
                </label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-md flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline text-[20px]">mail</span>
</div>
<input class="block w-full pl-[44px] pr-md py-md border border-outline-variant rounded-lg bg-surface-container-lowest font-body-md text-body-md text-on-surface focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all shadow-sm placeholder:text-outline-variant" id="email" name="email" placeholder="dr.smith@clinic.com" required="" type="email"/>
</div>
</div>
<!-- Submit Button -->
<button class="w-full flex items-center justify-center bg-primary text-on-primary font-label-md text-label-md py-[14px] px-lg rounded-lg hover:bg-on-primary-fixed-variant hover:-translate-y-[1px] hover:shadow-[0_4px_10px_rgba(0,80,203,0.2)] transition-all duration-200 active:translate-y-0" type="submit">
                Send Reset Link
            </button>
</form>
<!-- Footer / Back Link -->
<div class="mt-xl text-center">
<a class="inline-flex items-center gap-xs font-label-md text-label-md text-primary hover:text-on-primary-fixed-variant transition-colors group" href="#">
<span class="material-symbols-outlined text-[16px] group-hover:-translate-x-[2px] transition-transform">arrow_back</span>
                Back to login
            </a>
</div>
</main>
