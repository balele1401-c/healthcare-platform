        /* Ambient shadow for cards based on guidelines */
        .shadow-ambient {
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.04);
        }
        /* Custom input focus ring glow */
        .focus-glow:focus {
            box-shadow: 0 0 0 2px rgba(0, 80, 203, 0.2); /* Primary color at 20% opacity */
        }

    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-surface text-on-surface font-body-md antialiased min-h-screen flex items-center justify-center p-md lg:p-lg relative overflow-hidden">
<!-- Decorative subtle background elements -->
<div class="absolute top-0 left-0 w-full h-full pointer-events-none overflow-hidden z-0">
<div class="absolute -top-[20%] -left-[10%] w-[50%] h-[50%] rounded-full bg-primary/5 blur-3xl mix-blend-multiply"></div>
<div class="absolute bottom-[10%] -right-[10%] w-[40%] h-[40%] rounded-full bg-secondary-container/20 blur-3xl mix-blend-multiply"></div>
</div>
<!-- Main Card Container -->
<main class="w-full max-w-[420px] bg-surface-container-lowest rounded-xl shadow-ambient border border-outline-variant p-xl lg:p-xl relative z-10">
<!-- Header -->
<div class="text-center mb-xl">
<div class="flex justify-center items-center gap-2 mb-sm">
<span class="material-symbols-outlined text-primary text-[32px]" style="font-variation-settings: 'FILL' 1;">health_and_safety</span>
<h1 class="font-headline-lg text-headline-lg font-bold text-primary">HealthCare</h1>
</div>
<p class="font-body-md text-body-md text-on-surface-variant">Secure access to your patient portal</p>
</div>
<!-- Login Form -->
<form class="flex flex-col gap-lg">
<!-- Email Input -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface" for="email">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-on-surface-variant text-[20px]">mail</span>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg pl-[44px] pr-md py-[12px] font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none focus:border-primary focus-glow transition-all" id="email" placeholder="patient@example.com" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-xs">
<div class="flex justify-between items-center">
<label class="font-label-md text-label-md text-on-surface" for="password">Password</label>
<a class="font-label-md text-label-md text-primary hover:text-primary-container transition-colors focus:outline-none focus:underline" href="#">Forgot Password?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-on-surface-variant text-[20px]">lock</span>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg pl-[44px] pr-md py-[12px] font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none focus:border-primary focus-glow transition-all" id="password" placeholder="••••••••" type="password"/>
</div>
</div>
<!-- Action Button -->
<button class="w-full bg-primary text-on-primary font-label-md text-label-md py-[14px] rounded-lg mt-sm hover:bg-primary-container hover:-translate-y-[1px] hover:shadow-md transition-all active:scale-[0.98] flex items-center justify-center gap-2" type="button">
<span>Sign In</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</form>
<!-- Divider -->
<div class="flex items-center gap-md my-xl">
<div class="flex-1 h-[1px] bg-outline-variant"></div>
<span class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider">Or continue with</span>
<div class="flex-1 h-[1px] bg-outline-variant"></div>
</div>
<!-- Social Logins -->
<div class="flex gap-md">
<!-- Google -->
<button class="flex-1 flex justify-center items-center gap-sm bg-surface-container-lowest border border-outline-variant text-on-surface font-label-md text-label-md py-[10px] rounded-lg hover:bg-surface-container-low transition-colors focus:outline-none focus:ring-2 focus:ring-outline-variant" type="button">
<svg class="w-5 h-5" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
                Google
            </button>
<!-- Apple -->
<button class="flex-1 flex justify-center items-center gap-sm bg-surface-container-lowest border border-outline-variant text-on-surface font-label-md text-label-md py-[10px] rounded-lg hover:bg-surface-container-low transition-colors focus:outline-none focus:ring-2 focus:ring-outline-variant" type="button">
<svg class="w-5 h-5 fill-current" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.05 2.26.45 3.09.45.71 0 1.88-.45 3.35-.45 1.65 0 3.12.8 4 2.15-3.22 1.94-2.64 6.73.55 8.12-.76 1.44-1.85 2.81-2.99 2.7zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"></path>
</svg>
                Apple
            </button>
</div>
<!-- Footer Link -->
<div class="mt-xl pt-lg border-t border-outline-variant text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                New to HealthCare? 
                <a class="font-label-md text-label-md text-primary hover:underline ml-1" href="#">Create an account</a>
</p>
</div>
</main>
</body></html>
