<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md antialiased">
<!-- Header / TopAppBar -->
<header class="flex justify-between items-center w-full px-margin-mobile h-16 sticky top-0 z-50 bg-surface border-b border-outline-variant flat no shadows">
<button aria-label="Back" class="flex items-center justify-center p-2 text-primary hover:bg-surface-container-high transition-colors rounded-full">
<span class="material-symbols-outlined" data-icon="arrow_back" data-weight="regular">arrow_back</span>
</button>
<div class="font-headline-md text-headline-md-mobile md:text-headline-md font-bold text-primary">
            HealthCare
        </div>
<div class="w-10"></div> <!-- Spacer for centering -->
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex items-center justify-center p-margin-mobile md:p-margin-desktop">
<!-- Verification Card -->
<div class="bg-surface-container-lowest rounded-xl border border-outline-variant shadow-[0_4px_15px_rgba(0,0,0,0.04)] w-full max-w-md p-lg md:p-xl flex flex-col gap-lg">
<!-- Icon & Titles -->
<div class="flex flex-col items-center text-center gap-md">
<div class="w-16 h-16 bg-surface-container-high rounded-full flex items-center justify-center text-primary mb-2">
<span class="material-symbols-outlined text-4xl" data-icon="lock_reset">lock_reset</span>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-sm md:text-headline-sm text-on-surface">
                    Verification Code
                </h1>
<p class="font-body-md text-body-md text-on-surface-variant">
                    We've sent a 6-digit code to your registered email address to verify your identity.
                </p>
</div>
<!-- OTP Input Form -->
<form class="flex flex-col gap-lg" id="otp-form">
<div class="flex justify-between gap-2 sm:gap-4">
<input aria-label="Digit 1" autocomplete="one-time-code" class="otp-input w-12 h-14 sm:w-14 sm:h-16 text-center font-headline-md text-headline-md bg-surface-container-lowest border border-outline-variant rounded-lg text-on-surface" inputmode="numeric" maxlength="1" type="text"/>
<input aria-label="Digit 2" class="otp-input w-12 h-14 sm:w-14 sm:h-16 text-center font-headline-md text-headline-md bg-surface-container-lowest border border-outline-variant rounded-lg text-on-surface" inputmode="numeric" maxlength="1" type="text"/>
<input aria-label="Digit 3" class="otp-input w-12 h-14 sm:w-14 sm:h-16 text-center font-headline-md text-headline-md bg-surface-container-lowest border border-outline-variant rounded-lg text-on-surface" inputmode="numeric" maxlength="1" type="text"/>
<input aria-label="Digit 4" class="otp-input w-12 h-14 sm:w-14 sm:h-16 text-center font-headline-md text-headline-md bg-surface-container-lowest border border-outline-variant rounded-lg text-on-surface" inputmode="numeric" maxlength="1" type="text"/>
<input aria-label="Digit 5" class="otp-input w-12 h-14 sm:w-14 sm:h-16 text-center font-headline-md text-headline-md bg-surface-container-lowest border border-outline-variant rounded-lg text-on-surface" inputmode="numeric" maxlength="1" type="text"/>
<input aria-label="Digit 6" class="otp-input w-12 h-14 sm:w-14 sm:h-16 text-center font-headline-md text-headline-md bg-surface-container-lowest border border-outline-variant rounded-lg text-on-surface" inputmode="numeric" maxlength="1" type="text"/>
</div>
<!-- Resend & Timer -->
<div class="flex flex-col items-center justify-center gap-sm mt-2">
<p class="font-body-sm text-body-sm text-on-surface-variant flex items-center gap-1">
<span class="material-symbols-outlined text-sm" data-icon="timer">timer</span>
                        Code expires in <span class="font-label-md text-label-md text-primary ml-1" id="timer">02:59</span>
</p>
<button class="font-label-md text-label-md text-on-surface-variant opacity-50 cursor-not-allowed hover:text-primary transition-colors bg-transparent border-none p-2" disabled="" id="resend-btn" type="button">
                        Resend Code
                    </button>
</div>
<!-- Action Button -->
<button class="w-full bg-primary text-on-primary font-label-md text-label-md h-12 rounded-lg flex items-center justify-center hover:bg-primary-fixed-variant transition-colors shadow-[0_4px_15px_rgba(0,0,0,0.04)] hover:shadow-md hover:-translate-y-[1px]" type="submit">
                    Verify
                </button>
</form>
<div class="text-center mt-4">
<button class="font-body-sm text-body-sm text-primary bg-transparent hover:underline" type="button">
                    Need help? Contact Support
                </button>
</div>

</main>
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const inputs = document.querySelectorAll('.otp-input');
            const timerElement = document.getElementById('timer');
            const resendBtn = document.getElementById('resend-btn');
            
            // Auto-focus first input
            inputs[0].focus();

            // Handle Input behavior
            inputs.forEach((input, index) => {
                input.addEventListener('input', (e) => {
                    // Allow only numbers
                    e.target.value = e.target.value.replace(/[^0-9]/g, '');
                    
                    if (e.target.value && index < inputs.length - 1) {
                        inputs[index + 1].focus();
                    }
                });

                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Backspace' && !e.target.value && index > 0) {
                        inputs[index - 1].focus();
                        inputs[index - 1].value = '';
                    }
                });
                
                // Handle paste
                input.addEventListener('paste', (e) => {
                    e.preventDefault();
                    const pastedData = e.clipboardData.getData('text').replace(/[^0-9]/g, '').slice(0, inputs.length);
                    if(pastedData) {
                        for(let i=0; i<pastedData.length; i++) {
                            if(i < inputs.length) {
                                inputs[i].value = pastedData[i];
                                if(i < inputs.length -1) {
                                    inputs[i+1].focus();
                                }
                            }
                        }
                    }
                });
            });

            // Mock Timer
            let timeLeft = 179; // 2:59
            let timerInterval = setInterval(() => {
                timeLeft--;
                let minutes = Math.floor(timeLeft / 60);
                let seconds = timeLeft % 60;
                
                timerElement.textContent = `0${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
                
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    timerElement.textContent = "00:00";
                    resendBtn.disabled = false;
                    resendBtn.classList.remove('opacity-50', 'cursor-not-allowed', 'text-on-surface-variant');
                    resendBtn.classList.add('text-primary');
                }
            }, 1000);
            
            // Form Submit prevent default
            document.getElementById('otp-form').addEventListener('submit', (e) => {
                e.preventDefault();
                // Add your verification logic here
                console.log('Verifying code...');
                // Visual feedback
                const btn = e.target.querySelector('button[type="submit"]');
                const originalText = btn.textContent;
                btn.innerHTML = '<span class="material-symbols-outlined animate-spin" data-icon="progress_activity">progress_activity</span>';
                setTimeout(() => {
                    btn.textContent = originalText;
                }, 1500);
            });
        });
    </script>
