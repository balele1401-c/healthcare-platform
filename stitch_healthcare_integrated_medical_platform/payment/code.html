<body class="bg-surface font-body-md text-on-surface antialiased">
<!-- TopAppBar -->
<header class="bg-surface border-b border-outline-variant flat no shadows flex justify-between items-center w-full px-margin-mobile md:px-margin-desktop h-16 sticky top-0 z-50">
<div class="flex items-center gap-sm">
<button class="text-on-surface-variant hover:bg-surface-container-high transition-colors p-sm rounded-full flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold text-primary">HealthCare</h1>
</div>
<div class="flex items-center gap-sm">
<span class="font-headline-sm text-headline-sm text-on-surface">Payment</span>
</div>
</header>
<main class="max-w-3xl mx-auto px-margin-mobile md:px-margin-desktop py-xl">
<div class="bg-white rounded-xl border border-outline-variant shadow-[0_4px_15px_rgba(0,0,0,0.04)] p-lg md:p-xl mb-xl">
<!-- Total Amount -->
<div class="text-center mb-xl">
<p class="font-body-md text-body-md text-on-surface-variant mb-xs">Total amount to pay</p>
<p class="font-display-lg text-display-lg text-primary">$155.00</p>
</div>
<!-- Payment Method Selection -->
<div class="mb-xl">
<h2 class="font-headline-sm text-headline-sm text-on-surface mb-md">Select Payment Method</h2>
<div class="grid grid-cols-1 md:grid-cols-2 gap-md">
<!-- Credit Card (Selected) -->
<label class="relative flex items-center p-md bg-surface-container-lowest border-2 border-primary rounded-lg cursor-pointer transition-all">
<input checked="" class="sr-only" name="payment_method" type="radio" value="card"/>
<div class="flex items-center justify-between w-full">
<div class="flex items-center gap-md">
<span class="material-symbols-outlined text-primary" data-icon="credit_card">credit_card</span>
<span class="font-body-md text-body-md text-on-surface font-semibold">Credit/Debit Card</span>
</div>
<span class="material-symbols-outlined text-primary" data-icon="check_circle" data-weight="fill" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</label>
<!-- Apple Pay -->
<label class="relative flex items-center p-md bg-surface-container-lowest border border-outline-variant rounded-lg cursor-pointer hover:border-primary transition-all">
<input class="sr-only" name="payment_method" type="radio" value="apple"/>
<div class="flex items-center justify-between w-full">
<div class="flex items-center gap-md">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="contactless">contactless</span>
<span class="font-body-md text-body-md text-on-surface">Apple Pay</span>
</div>
</div>
</label>
<!-- Google Pay -->
<label class="relative flex items-center p-md bg-surface-container-lowest border border-outline-variant rounded-lg cursor-pointer hover:border-primary transition-all">
<input class="sr-only" name="payment_method" type="radio" value="google"/>
<div class="flex items-center justify-between w-full">
<div class="flex items-center gap-md">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="contactless">contactless</span>
<span class="font-body-md text-body-md text-on-surface">Google Pay</span>
</div>
</div>
</label>
<!-- Insurance -->
<label class="relative flex items-center p-md bg-surface-container-lowest border border-outline-variant rounded-lg cursor-pointer hover:border-primary transition-all">
<input class="sr-only" name="payment_method" type="radio" value="insurance"/>
<div class="flex items-center justify-between w-full">
<div class="flex items-center gap-md">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="health_and_safety">health_and_safety</span>
<span class="font-body-md text-body-md text-on-surface">Use Health Insurance</span>
</div>
</div>
</label>
</div>
</div>
<!-- Credit Card Input Section -->
<div class="mb-xl bg-surface-bright rounded-lg p-md border border-outline-variant">
<h3 class="font-body-lg text-body-lg text-on-surface font-semibold mb-md">Card Details</h3>
<div class="space-y-md">
<!-- Card Number -->
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-xs">Card Number</label>
<div class="relative">
<input class="w-full bg-white border border-outline-variant rounded-lg p-sm pl-[40px] focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all font-body-md text-body-md text-on-surface outline-none" placeholder="0000 0000 0000 0000" type="text"/>
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-on-surface-variant" data-icon="credit_card">credit_card</span>
</div>
</div>
<div class="grid grid-cols-2 gap-md">
<!-- Expiry Date -->
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-xs">Expiry Date</label>
<input class="w-full bg-white border border-outline-variant rounded-lg p-sm focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all font-body-md text-body-md text-on-surface outline-none" placeholder="MM/YY" type="text"/>
</div>
<!-- CVV -->
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-xs">CVV</label>
<div class="relative">
<input class="w-full bg-white border border-outline-variant rounded-lg p-sm pr-[40px] focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all font-body-md text-body-md text-on-surface outline-none" placeholder="123" type="text"/>
<span class="material-symbols-outlined absolute right-sm top-1/2 -translate-y-1/2 text-on-surface-variant cursor-help" data-icon="help">help</span>
</div>
</div>
</div>
<!-- Cardholder Name -->
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-xs">Cardholder Name</label>
<input class="w-full bg-white border border-outline-variant rounded-lg p-sm focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all font-body-md text-body-md text-on-surface outline-none" placeholder="John Doe" type="text"/>
</div>
</div>
</div>
<!-- Actions -->
<div class="mt-xl">
<button class="w-full bg-primary hover:bg-surface-tint text-on-primary font-body-lg text-body-lg font-semibold py-md rounded-lg shadow-[0_4px_10px_rgba(0,80,203,0.2)] hover:-translate-y-[1px] transition-all flex items-center justify-center gap-sm">
<span class="material-symbols-outlined" data-icon="lock">lock</span>
                    Pay $155.00 Now
                </button>
<div class="flex items-center justify-center gap-xs mt-md text-on-surface-variant">
<span class="material-symbols-outlined text-sm" data-icon="verified_user">verified_user</span>
<span class="font-label-md text-label-md">128-bit SSL Secure Payment</span>
</div>
</div>
</div>
</main>
<script>
        // Simple radio button toggle logic for demonstration
        document.querySelectorAll('input[name="payment_method"]').forEach(radio => {
            radio.addEventListener('change', function() {
                // Reset all labels
                document.querySelectorAll('label:has(input[name="payment_method"])').forEach(label => {
                    label.classList.remove('border-2', 'border-primary');
                    label.classList.add('border', 'border-outline-variant');
                    const checkIcon = label.querySelector('[data-icon="check_circle"]');
                    if (checkIcon) checkIcon.remove();
                });

                // Style active label
                const activeLabel = this.closest('label');
                activeLabel.classList.remove('border', 'border-outline-variant');
                activeLabel.classList.add('border-2', 'border-primary');
                
                // Add check icon
                const iconContainer = activeLabel.querySelector('.flex.items-center.justify-between');
                if(iconContainer && !activeLabel.querySelector('[data-icon="check_circle"]')) {
                    const checkSpan = document.createElement('span');
                    checkSpan.className = 'material-symbols-outlined text-primary';
                    checkSpan.setAttribute('data-icon', 'check_circle');
                    checkSpan.setAttribute('data-weight', 'fill');
                    checkSpan.style.fontVariationSettings = "'FILL' 1";
                    checkSpan.textContent = 'check_circle';
                    iconContainer.appendChild(checkSpan);
                }
            });
        });
    </script>
